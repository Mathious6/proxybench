version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      frontend:
        applies-to: version-updates
        patterns: ["*"]
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust:
        applies-to: version-updates
        patterns: ["*"]
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
