name: Bug report
description: Report a reproducible problem in proxybench
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Never include proxy credentials or attach a real proxy list.
  - type: input
    id: version
    attributes:
      label: proxybench version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized screenshots or other useful details.
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data
      options:
        - label: I removed proxy credentials, proxy lists, and secrets from this report.
          required: true
