[package]
name = "proxybench"
version = "0.3.0"
description = "Split HTTP proxy lists by subnet and measure Connect and TTFB"
edition = "2021"
license = "MIT"

[lib]
name = "proxybench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tauri-plugin-dialog = "2"
url = "2"
tokio = { version = "1", features = ["net", "time", "rt", "macros", "io-util", "sync"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rustls-pki-types = "1"
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "71df1a095d007fb94f0eb07940b0a78e57ac984e", version = "2.10.1" }
tauri-plugin-process = "2"

[dev-dependencies]
rcgen = "0.13"
